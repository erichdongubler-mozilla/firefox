<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: f;
  src: local(""), local("Arial");
}
.outer { display: flex; }
.inner { display: flex; }
.inner div { font-family: f; text-transform: uppercase; }
</style>
<script>
function main() {
  const ff = new FontFace("g", 'local("")');
  document.fonts.add(ff);
  ff.load().catch(() => {});
  document.getElementById("t").style.fontFamily = "f, g";
  document.body.offsetWidth;
}
window.addEventListener("load", main);
</script>
</head>
<body>
<div class="outer"><div class="inner"><div id="t">text</div></div></div>
</body>
</html>
